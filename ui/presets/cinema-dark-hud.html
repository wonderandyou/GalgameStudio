<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>奇迹工坊 · 暗色电影感 · hud</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#080a0d}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.stage{position:relative;width:100vw;height:100vh;overflow:hidden;user-select:none}
.ver{position:absolute;font-size:12px;letter-spacing:.14em;opacity:.55;font-family:Consolas,monospace}
.corner{position:absolute;display:flex;gap:16px;align-items:center}
.corner button{background:none;border:0;cursor:pointer;font-size:19px;line-height:1;
  opacity:.62;transition:opacity .18s,transform .18s;padding:4px}
.corner button:hover{opacity:1;transform:scale(1.12)}

.s{position:absolute;inset:0;background:#080a0d;display:flex;padding:46px;gap:28px}
.frame-tag{position:absolute;left:46px;top:30px;font-family:Consolas,monospace;
  font-size:11.5px;letter-spacing:.22em;color:#c9974f;opacity:.85}
.card{position:relative;border-radius:4px}
.dialog-wrap{position:absolute;left:4%;right:4%;bottom:4%;height:30%;
  background:rgba(8,10,13,.88);border:1px solid rgba(201,151,79,.28);border-radius:4px;
  display:flex;flex-direction:column;justify-content:center;gap:14px;padding:26px 34px}
.who{font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:15px;letter-spacing:.16em;color:#c9974f}
.say{font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:25px;line-height:1.5;color:#f6f1e6;letter-spacing:.03em}
.choices{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;gap:14px;width:min(620px,52%)}
.opt{background:rgba(14,17,22,.92);border:1px solid rgba(201,151,79,.30);border-radius:4px;
  padding:18px 26px;font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:19px;letter-spacing:.08em;
  color:rgba(246,241,230,.86);transition:background .2s}
.opt.on{background:rgba(201,151,79,.14)}
.slots{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  display:grid;grid-template-columns:1fr 1fr;gap:18px;width:min(880px,74%)}
.slot{background:#0c0f14;border:1px solid #c9974f;border-radius:4px;
  padding:20px 22px;font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#f6f1e6}
.slot b{display:block;font-size:17px;letter-spacing:.06em;margin-bottom:8px}
.slot span{font-family:Consolas,monospace;font-size:11.5px;color:#c9974f;opacity:.85}
.row{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(760px,64%);display:flex;flex-direction:column;gap:2px}
.ri{display:flex;justify-content:space-between;align-items:center;padding:17px 4px;
  border-bottom:1px solid #c9974f;font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:17px;color:#f6f1e6}
.ri em{font-style:normal;color:#c9974f;font-family:Consolas,monospace;font-size:13px}
.hudbar{position:absolute;left:0;right:0;top:0;height:96px;background:rgba(8,10,13,.55);
  display:flex;align-items:center;padding:0 34px;gap:26px;
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:14px;letter-spacing:.12em;color:rgba(246,241,230,.80)}
.hudbar b{font-weight:700;font-size:15px;letter-spacing:.06em}
.hudbar .sp{flex:1}

</style></head><body><div class="stage"><div class="s"><div style="position:absolute;inset:0;background-image:url('../assets/title/bg_port.png');background-size:cover;background-position:center;opacity:.45"></div><div class="frame-tag">暗色电影感 · hud</div><div class="hudbar"><b>奇迹工坊</b><span>第一章 · 雨夜码头</span><span class="sp"></span><span>⏸  ⚙</span></div></div></div></body></html>
